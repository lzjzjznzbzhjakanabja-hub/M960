<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>KIWI CITY 3D</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#111;color:white;font-family:Arial,sans-serif;touch-action:none}#game{width:100%;height:100%;display:block}#hud{position:fixed;top:12px;left:12px;z-index:3;background:#0008;padding:8px 12px;border-radius:12px;font-weight:bold}#help{position:fixed;top:12px;right:12px;z-index:3;background:#0008;padding:8px 12px;border-radius:12px;font-size:12px;text-align:right}.controls{position:fixed;inset:auto 0 16px 0;z-index:4;display:flex;justify-content:space-between;align-items:end;padding:0 18px;pointer-events:none}.pad,.actions{display:grid;gap:8px;pointer-events:auto}.pad{grid-template-columns:64px 64px 64px;grid-template-rows:64px 64px}.actions{grid-template-columns:70px 70px}.btn{width:64px;height:64px;border:1px solid #fff5;border-radius:18px;background:#111b;color:white;font-size:25px;font-weight:bold;backdrop-filter:blur(6px);-webkit-tap-highlight-color:transparent}.btn:active,.btn.on{background:#fff5}.wide{width:70px;height:70px;font-size:13px}.up{grid-column:2}.left{grid-column:1;grid-row:2}.down{grid-column:2;grid-row:2}.right{grid-column:3;grid-row:2}.start{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;background:#081018}.card{max-width:360px;margin:20px;text-align:center;background:#111d;padding:28px;border-radius:24px;border:1px solid #fff2}.card h1{font-size:42px;margin:0 0 8px}.card p{opacity:.8;line-height:1.5}.go{margin-top:20px;padding:15px;border-radius:14px;background:#fff;color:#111;font-weight:bold}#mini{position:fixed;bottom:145px;right:16px;width:110px;height:110px;border-radius:12px;background:#111c;border:1px solid #fff3;z-index:3}</style></head><body><canvas id="game"></canvas><div id="hud">💰 $<span id="money">0</span></div><div id="help">KIWI CITY 3D<br>Телефонное управление</div><div class="start" id="start"><div class="card"><h1>KIWI <b>CITY</b></h1><p>3D мобильный прототип города</p><p>Управляй машиной кнопками снизу. Нажми 🚪, чтобы выйти/сесть в машину.</p><button class="go" id="startBtn" type="button">НАЖМИ, ЧТОБЫ НАЧАТЬ</button></div></div><div class="controls"><div class="pad"><button class="btn up" data-k="up">▲</button><button class="btn left" data-k="left">◀</button><button class="btn down" data-k="down">▼</button><button class="btn right" data-k="right">▶</button></div><div class="actions"><button class="btn wide" data-k="hand">РУЧНИК</button><button class="btn wide" data-k="exit">🚪 F</button><button class="btn wide" data-k="cam">📷 C</button><button class="btn wide" data-k="restart">↻ R</button></div></div><script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script><script>
const canvas=document.getElementById('game'),scene=new THREE.Scene();scene.background=new THREE.Color(0x87b9d9);scene.fog=new THREE.Fog(0x87b9d9,180,650);const camera=new THREE.PerspectiveCamera(60,innerWidth/innerHeight,.1,1200),renderer=new THREE.WebGLRenderer({canvas,antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;
scene.add(new THREE.HemisphereLight(0xffffff,0x445566,1.5));const sun=new THREE.DirectionalLight(0xffffff,1.4);sun.position.set(100,180,80);sun.castShadow=true;scene.add(sun);
const roadMat=new THREE.MeshLambertMaterial({color:0x30343a}),sideMat=new THREE.MeshLambertMaterial({color:0x55734b}),buildingMats=[0x777b82,0x9b8c7a,0x68727d,0x8a7370,0x646d60].map(c=>new THREE.MeshLambertMaterial({color:c}));
const ground=new THREE.Mesh(new THREE.PlaneGeometry(1200,1200),sideMat);ground.rotation.x=-Math.PI/2;scene.add(ground);
const BLOCK=70,ROAD=18,N=12,car={x:0,z:0,a:0,speed:0};let money=0,camMode=0,driving=true;
function box(x,y,z,w,h,d,mat){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);m.position.set(x,y,z);m.castShadow=true;m.receiveShadow=true;scene.add(m);return m}
for(let i=-N/2;i<N/2;i++)for(let j=-N/2;j<N/2;j++){let cx=i*(BLOCK+ROAD),cz=j*(BLOCK+ROAD);box(cx,0.05,cz,BLOCK,0.1,BLOCK,sideMat);for(let q=-1;q<=1;q+=2)for(let r=-1;r<=1;r+=2){let x=cx+q*18+Math.random()*8,z=cz+r*18+Math.random()*8,w=14+Math.random()*13,d=14+Math.random()*13,h=10+Math.random()*45;box(x,h/2,z,w,h,d,buildingMats[Math.floor(Math.random()*buildingMats.length)]);}}
for(let i=-N/2;i<=N/2;i++){let p=i*(BLOCK+ROAD);box(p,0.08,0,ROAD,.16,900,roadMat);box(0,0.09,p,900,.18,ROAD,roadMat)}
// lane markings
const markMat=new THREE.MeshBasicMaterial({color:0xf4d35e});for(let i=-N/2;i<=N/2;i++){let p=i*(BLOCK+ROAD);for(let t=-450;t<450;t+=28){box(p,.12,t,0.7,.03,12,markMat);box(t,.12,p,12,.03,.7,markMat)}}
// car
const carBody=box(0,2,0,4,1.3,7,new THREE.MeshLambertMaterial({color:0xe63946}));box(0,2.8,0.4,3.3,1.1,3,new THREE.MeshLambertMaterial({color:0x263238}));
const carGroup=new THREE.Group();scene.add(carGroup);carGroup.add(carBody); // body already in scene; move via group is invalid, fix below
scene.remove(carBody);carGroup.add(carBody);function wheel(x,z){let w=new THREE.Mesh(new THREE.CylinderGeometry(.7,.7,.45,16),new THREE.MeshLambertMaterial({color:0x111111}));w.rotation.z=Math.PI/2;w.position.set(x,1,z);carGroup.add(w)}wheel(-2,-2);wheel(2,-2);wheel(-2,2);wheel(2,2);
const keys={up:false,down:false,left:false,right:false,hand:false};function set(k,v){keys[k]=v}
document.querySelectorAll('.btn').forEach(b=>{let k=b.dataset.k;if(k==='exit'||k==='cam'||k==='restart')b.addEventListener('pointerdown',e=>{e.preventDefault();if(k==='exit'){driving=!driving}if(k==='cam'){camMode=(camMode+1)%2}if(k==='restart'){car.x=0;car.z=0;car.a=0;car.speed=0;money=0;document.getElementById('money').textContent=0}});else{b.addEventListener('pointerdown',e=>{e.preventDefault();b.classList.add('on');set(k,true)});['pointerup','pointercancel','pointerleave'].forEach(ev=>b.addEventListener(ev,()=>{b.classList.remove('on');set(k,false)}));}});
window.addEventListener('keydown',e=>{let k={w:'up',ArrowUp:'up',s:'down',ArrowDown:'down',a:'left',ArrowLeft:'left',d:'right',ArrowRight:'right',' ':'hand'}[e.key];if(k)set(k,true);if(e.key.toLowerCase()==='f')driving=!driving;if(e.key.toLowerCase()==='c')camMode=(camMode+1)%2;if(e.key.toLowerCase()==='r'){car.x=car.z=0;car.a=0;car.speed=0}});window.addEventListener('keyup',e=>{let k={w:'up',ArrowUp:'up',s:'down',ArrowDown:'down',a:'left',ArrowLeft:'left',d:'right',ArrowRight:'right',' ':'hand'}[e.key];if(k)set(k,false)});
const start=document.getElementById('start'),startBtn=document.getElementById('startBtn');
function beginGame(e){if(e)e.preventDefault();start.style.display='none';}
start.addEventListener('pointerdown',beginGame,{passive:false});
startBtn.addEventListener('click',beginGame);
let last=performance.now();function loop(now){let dt=Math.min((now-last)/1000,.05);last=now;if(driving){if(keys.up)car.speed+=22*dt;if(keys.down)car.speed-=25*dt;car.speed*=Math.pow(.985,dt*60);if(keys.hand)car.speed*=.94;car.speed=Math.max(-10,Math.min(38,car.speed));let steer=(keys.left?-1:0)+(keys.right?1:0);car.a+=steer*1.9*dt*(.25+Math.min(Math.abs(car.speed)/18,1));car.x+=Math.sin(car.a)*car.speed*dt;car.z+=Math.cos(car.a)*car.speed*dt}else{car.speed*=.9}carGroup.position.set(car.x,0,car.z);carGroup.rotation.y=car.a;
if(camMode===0){let dist=18,height=11;camera.position.set(car.x-Math.sin(car.a)*dist,height,car.z-Math.cos(car.a)*dist);camera.lookAt(car.x,2,car.z)}else{camera.position.set(car.x,3,car.z);camera.lookAt(car.x+Math.sin(car.a)*30,2,car.z+Math.cos(car.a)*30)}renderer.render(scene,camera);requestAnimationFrame(loop)}}
requestAnimationFrame(loop);addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script></body></html>
