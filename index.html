<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>KIWI CITY — GTA-прототип</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#111;font-family:system-ui,Segoe UI,Arial}
  canvas{display:block}
  #overlay{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    background:rgba(10,12,20,.82);color:#fff;text-align:center;z-index:5;cursor:pointer}
  #overlay h1{font-size:52px;margin:0 0 6px;letter-spacing:2px;text-shadow:0 4px 18px #000}
  #overlay h1 b{color:#ffd23f}
  #overlay p{margin:4px 0;color:#cdd3e0}
  #overlay .keys{margin-top:18px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);
    border-radius:14px;padding:14px 26px;line-height:1.9;font-size:15px}
  kbd{background:#2a2f3f;border:1px solid #4a5169;border-bottom-width:3px;border-radius:6px;padding:1px 8px;font-family:inherit}
  #overlay .go{margin-top:18px;color:#ffd23f;font-weight:700;animation:bl 1.2s infinite}
  @keyframes bl{50%{opacity:.35}}
</style>
</head>
<body>
<div id="overlay">
  <h1>KIWI <b>CITY</b></h1>
  <p>Прототип GTA-подобной игры · процедурный город 7.6 × 7.6 км</p>
  <div class="keys">
    <kbd>W</kbd>/<kbd>↑</kbd> газ &nbsp; <kbd>S</kbd>/<kbd>↓</kbd> тормоз/назад &nbsp; <kbd>A</kbd> <kbd>D</kbd> руль<br>
    <kbd>Пробел</kbd> ручник (дрифт) &nbsp; <kbd>F</kbd> выйти/угнать машину &nbsp; <kbd>R</kbd> рестарт &nbsp; <kbd>C</kbd> камера
  </div>
  <div class="go">Нажми любую клавишу, чтобы начать</div>
</div>
<canvas id="c"></canvas>
<script>
"use strict";
// ======================= МИР =======================
var BLOCK=330, ROAD=90, PITCH=BLOCK+ROAD, N=18, WORLD=N*PITCH+ROAD; // ~7650px
var canvas=document.getElementById('c'), ctx=canvas.getContext('2d');
var W=0,H=0,DPR=1;
function resize(){DPR=Math.min(window.devicePixelRatio||1,2);W=window.innerWidth;H=window.innerHeight;
  canvas.width=W*DPR;canvas.height=H*DPR;canvas.style.width=W+'px';canvas.style.height=H+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);}
window.addEventListener('resize',resize);resize();

// детерминированный рандом
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);
  t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
var rnd=mulberry(1337);
function rr(a,b){return a+rnd()*(b-a)}

// генерация кварталов
var PAL=['#c9ada7','#b08968','#90a955','#e07a5f','#8d99ae','#c8b6ff','#a7c957','#d4a373','#9d8189','#84a98c','#e9c46a','#f4a261'];
var grid=[];
for(var i=0;i<N;i++){grid[i]=[];for(var j=0;j<N;j++){
  var x0=i*PITCH+ROAD, y0=j*PITCH+ROAD, b={x:x0,y:y0,park:rnd()<0.12,buildings:[],trees:[]};
  if(b.park){
    b.pond={x:x0+BLOCK/2+rr(-50,50),y:y0+BLOCK/2+rr(-50,50),r:rr(45,80)};
    for(var t=0;t<16;t++)b.trees.push({x:x0+rr(15,BLOCK-15),y:y0+rr(15,BLOCK-15),r:rr(6,11)});
  }else{
    for(var lx=0;lx<2;lx++)for(var ly=0;ly<2;ly++){
      if(rnd()<0.72){
        var ls=BLOCK/2-26, w=rr(ls*0.5,ls*0.92), h=rr(ls*0.5,ls*0.92);
        var ox=x0+16+lx*(BLOCK/2-10), oy=y0+16+ly*(BLOCK/2-10);
        b.buildings.push({x:ox+rr(0,Math.max(1,ls-w)),y:oy+rr(0,Math.max(1,ls-h)),w:w,h:h,c:PAL[(rnd()*PAL.length)|0]});
      }
    }
    for(var t2=0;t2<6;t2++){var m=rr(6,14);
      b.trees.push({x:x0+(rnd()<0.5?rr(m,BLOCK-m):rr(m,BLOCK-m)),y:y0+rr(m,BLOCK-m),r:rr(5,9)});}
  }
  grid[i][j]=b;}
}

// ======================= МАШИНА =======================
var car={x:PITCH*2+ROAD/2,y:PITCH*5+ROAD/2,a:-Math.PI/2,vx:0,vy:0,c:'#e63946'};
var onFoot=false, foot={x:car.x+34,y:car.y}, parked=[], nearCar=null;
var keys={},started=false,zoomMode=0;
var money=0;
addEventListener('keydown',function(e){keys[e.code]=true;
  if(!started){started=true;document.getElementById('overlay').style.display='none';}
  if(e.code==='KeyR'){car.x=PITCH*2+ROAD/2;car.y=PITCH*5+ROAD/2;car.a=-Math.PI/2;car.vx=car.vy=0;onFoot=false;foot.x=car.x+34;foot.y=car.y;}
  if(e.code==='KeyF'){
    if(!onFoot){ // выйти
      if(Math.hypot(car.vx,car.vy)<60){
        parked.push({x:car.x,y:car.y,a:car.a,c:car.c});
        onFoot=true;foot.x=car.x+Math.cos(car.a+1.57)*36;foot.y=car.y+Math.sin(car.a+1.57)*36;
      }
    }else if(nearCar){ // сесть/угнать
      if(nearCar.pi!==undefined){var pc=parked.splice(nearCar.pi,1)[0];car.x=pc.x;car.y=pc.y;car.a=pc.a;car.c=pc.c;}
      else{var tc=traffic.splice(nearCar.ti,1)[0];car.x=tc.h?tc.s:tc.k*PITCH+ROAD/2+tc.lane;car.y=tc.h?tc.k*PITCH+ROAD/2+tc.lane:tc.s;car.a=tc.h?(tc.sp>0?0:Math.PI):(tc.sp>0?Math.PI/2:-Math.PI/2);car.c=tc.c;}
      car.vx=car.vy=0;onFoot=false;
    }
  }
  if(e.code==='KeyC'){zoomMode=(zoomMode+1)%2;}
  if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].indexOf(e.code)>=0)e.preventDefault();});
addEventListener('keyup',function(e){keys[e.code]=false});
document.getElementById('overlay').addEventListener('click',function(){started=true;this.style.display='none';});

// ======================= ТРАФИК / ПЕШЕХОДЫ / ДЕНЬГИ =======================
var traffic=[],peds=[],cash=[];
for(var k=0;k<26;k++){var horiz=rnd()<0.5;
  traffic.push({h:horiz,k:(rnd()*(N+1))|0,s:rr(0,WORLD),sp:rr(70,150)*(rnd()<0.5?1:-1),
    lane:rr(16,30)*(rnd()<0.5?1:-1),c:PAL[(rnd()*PAL.length)|0]});}
for(var p=0;p<50;p++)peds.push({x:rr(0,WORLD),y:rr(0,WORLD),a:rr(0,6.28),sp:rr(20,45),c:['#f1faee','#ffd23f','#a8dadc','#f4a261','#cdb4db'][(rnd()*5)|0]});
function roadPoint(){var h=rnd()<0.5,k=(rnd()*(N+1))|0,s=rr(60,WORLD-60),l=rr(14,30)*(rnd()<0.5?1:-1);
  return h?{x:s,y:k*PITCH+ROAD/2+l}:{x:k*PITCH+ROAD/2+l,y:s};}
for(var m2=0;m2<45;m2++){var rp=roadPoint();cash.push({x:rp.x,y:rp.y,v:(100*((rnd()*4)|0+1))||100,ph:rr(0,6.28)});}

// ======================= ФИЗИКА =======================
function collideWorld(px,py,R){
  var bi=Math.floor(px/PITCH), bj=Math.floor(py/PITCH);
  for(var i2=Math.max(0,bi-1);i2<=Math.min(N-1,bi+1);i2++)for(var j2=Math.max(0,bj-1);j2<=Math.min(N-1,bj+1);j2++){
    var b=grid[i2][j2];
    for(var q=0;q<b.buildings.length;q++){var B=b.buildings[q];
      var cx=Math.max(B.x,Math.min(px,B.x+B.w)), cy=Math.max(B.y,Math.min(py,B.y+B.h));
      var dx=px-cx,dy=py-cy,d2=dx*dx+dy*dy;
      if(d2<R*R){var d=Math.sqrt(d2)||0.01;px=cx+dx/d*R;py=cy+dy/d*R;}}
  }
  return [Math.max(R,Math.min(WORLD-R,px)),Math.max(R,Math.min(WORLD-R,py))];
}
function step(dt){
  if(onFoot){ // ===== ПЕШКОМ =====
    var mx=((keys.KeyD||keys.ArrowRight)?1:0)-((keys.KeyA||keys.ArrowLeft)?1:0);
    var my=((keys.KeyS||keys.ArrowDown)?1:0)-((keys.KeyW||keys.ArrowUp)?1:0);
    var l=Math.hypot(mx,my)||1; var sp=170;
    foot.x+=mx/l*sp*dt; foot.y+=my/l*sp*dt;
    var fp=collideWorld(foot.x,foot.y,9); foot.x=fp[0]; foot.y=fp[1];
    // поиск ближайшей машины
    nearCar=null; var nd=52;
    for(var q2=0;q2<parked.length;q2++){var pc=parked[q2],d=Math.hypot(pc.x-foot.x,pc.y-foot.y);if(d<nd){nd=d;nearCar={pi:q2};}}
    for(var q3=0;q3<traffic.length;q3++){var tx=traffic[q3].h?traffic[q3].s:traffic[q3].k*PITCH+ROAD/2+traffic[q3].lane,
      ty=traffic[q3].h?traffic[q3].k*PITCH+ROAD/2+traffic[q3].lane:traffic[q3].s;
      var d2=Math.hypot(tx-foot.x,ty-foot.y);if(d2<nd){nd=d2;nearCar={ti:q3};}}
  }
  if(!onFoot){
  var f=[Math.cos(car.a),Math.sin(car.a)];
  var spd=car.vx*f[0]+car.vy*f[1]; // скорость вперёд
  var accel=0,maxs=430;
  if(keys.KeyW||keys.ArrowUp)accel=300;
  if(keys.KeyS||keys.ArrowDown)accel=(spd>20)?-420:-200;
  var hb=keys.Space;
  car.vx+=f[0]*accel*dt; car.vy+=f[1]*accel*dt;
  // разложение на продольную/боковую
  var fwd=car.vx*f[0]+car.vy*f[1], lat=-car.vx*f[1]+car.vy*f[0];
  var grip=hb?1.4:9, drag=(accel===0?0.9:0.25)+(hb?2.2:0);
  fwd*=Math.exp(-drag*dt); lat*=Math.exp(-grip*dt);
  fwd=Math.max(-160,Math.min(maxs,fwd));
  car.vx=f[0]*fwd-f[1]*lat; car.vy=f[1]*fwd+f[0]*lat;
  // руль
  var steer=(keys.KeyA||keys.ArrowLeft?-1:0)+(keys.KeyD||keys.ArrowRight?1:0);
  var sf=Math.min(1,Math.abs(fwd)/130)*(fwd<0?-1:1);
  car.a+=steer*2.7*sf*(hb?1.5:1)*dt;
  car.x+=car.vx*dt; car.y+=car.vy*dt;
  // столкновения с миром
  var cp=collideWorld(car.x,car.y,16); car.x=cp[0]; car.y=cp[1];
  }
  // деньги
  for(var c2=0;c2<cash.length;c2++){var C=cash[c2],dx2=car.x-C.x,dy2=car.y-C.y;
    if(dx2*dx2+dy2*dy2<30*30){money+=C.v;var np=roadPoint();C.x=np.x;C.y=np.y;C.v=100*(1+((rnd()*4)|0));}}
  // трафик
  for(var t3=0;t3<traffic.length;t3++){var T=traffic[t3];T.s+=T.sp*dt;
    if(T.s>WORLD+60)T.s=-60; if(T.s<-60)T.s=WORLD+60;}
  // пешеходы
  for(var p2=0;p2<peds.length;p2++){var P=peds[p2];
    if(rnd()<0.01)P.a+=rr(-1,1);P.x+=Math.cos(P.a)*P.sp*dt;P.y+=Math.sin(P.a)*P.sp*dt;
    if(P.x<0||P.x>WORLD)P.a=Math.PI-P.a; if(P.y<0||P.y>WORLD)P.a=-P.a;
    P.x=Math.max(0,Math.min(WORLD,P.x));P.y=Math.max(0,Math.min(WORLD,P.y));}
}

// ======================= ОТРИСОВКА =======================
var camx=car.x,camy=car.y;
function draw(){
  var sc=zoomMode?0.55:1;
  var tgt=onFoot?foot:car; camx+=(tgt.x-camx)*0.12; camy+=(tgt.y-camy)*0.12;
  var vw=W/sc,vh=H/sc,left=camx-vw/2,top=camy-vh/2;
  ctx.fillStyle='#20242c';ctx.fillRect(0,0,W,H);
  ctx.save();ctx.translate(W/2,H/2);ctx.scale(sc,sc);ctx.translate(-camx,-camy);
  // трава
  ctx.fillStyle='#6aa84f';ctx.fillRect(Math.max(0,left),Math.max(0,top),Math.min(WORLD,left+vw)-Math.max(0,left),Math.min(WORLD,top+vh)-Math.max(0,top));
  // дороги
  var k0=Math.max(0,Math.floor(left/PITCH)),k1=Math.min(N,Math.floor((left+vw)/PITCH));
  ctx.fillStyle='#3c4048';
  for(var k=k0;k<=k1;k++){ctx.fillRect(k*PITCH,Math.max(0,top),ROAD,Math.min(WORLD,top+vh)-Math.max(0,top));
    ctx.fillRect(Math.max(0,left),k*PITCH,Math.min(WORLD,left+vw)-Math.max(0,left),ROAD);}
  // разметка
  ctx.strokeStyle='#e9c46a';ctx.lineWidth=3;ctx.setLineDash([26,30]);
  for(var k2=k0;k2<=k1;k2++){var cx=k2*PITCH+ROAD/2;
    ctx.beginPath();ctx.moveTo(cx,Math.max(0,top));ctx.lineTo(cx,Math.min(WORLD,top+vh));ctx.stroke();
    ctx.beginPath();ctx.moveTo(Math.max(0,left),cx);ctx.lineTo(Math.min(WORLD,left+vw),cx);ctx.stroke();}
  ctx.setLineDash([]);
  // кварталы
  var i0=Math.max(0,Math.floor(left/PITCH)),i1=Math.min(N-1,Math.floor((left+vw)/PITCH));
  var j0=Math.max(0,Math.floor(top/PITCH)),j1=Math.min(N-1,Math.floor((top+vh)/PITCH));
  for(var i3=i0;i3<=i1;i3++)for(var j3=j0;j3<=j1;j3++){var b=grid[i3][j3];
    // тротуар
    ctx.fillStyle='#b9bcae';ctx.fillRect(b.x-12,b.y-12,BLOCK+24,BLOCK+24);
    ctx.fillStyle=b.park?'#74c25c':'#79b95e';ctx.fillRect(b.x,b.y,BLOCK,BLOCK);
    if(b.park){ctx.fillStyle='#4d96ff';ctx.beginPath();ctx.ellipse(b.pond.x,b.pond.y,b.pond.r,b.pond.r*0.8,0,0,6.29);ctx.fill();
      ctx.fillStyle='#3a7bd5';ctx.beginPath();ctx.ellipse(b.pond.x-8,b.pond.y-8,b.pond.r*0.5,b.pond.r*0.4,0,0,6.29);ctx.fill();}
    for(var q2=0;q2<b.buildings.length;q2++){var B=b.buildings[q2];
      ctx.fillStyle='rgba(0,0,0,.25)';ctx.fillRect(B.x+5,B.y+7,B.w,B.h);
      ctx.fillStyle=B.c;ctx.fillRect(B.x,B.y,B.w,B.h);
      ctx.strokeStyle='rgba(0,0,0,.35)';ctx.lineWidth=3;ctx.strokeRect(B.x,B.y,B.w,B.h);
      ctx.fillStyle='rgba(255,255,255,.18)';ctx.fillRect(B.x+8,B.y+8,B.w-16,B.h-16);}
    for(var t4=0;t4<b.trees.length;t4++){var T2=b.trees[t4];
      ctx.fillStyle='rgba(0,0,0,.2)';ctx.beginPath();ctx.arc(T2.x+3,T2.y+4,T2.r,0,6.29);ctx.fill();
      ctx.fillStyle='#2d6a4f';ctx.beginPath();ctx.arc(T2.x,T2.y,T2.r,0,6.29);ctx.fill();
      ctx.fillStyle='#40916c';ctx.beginPath();ctx.arc(T2.x-2,T2.y-2,T2.r*0.6,0,6.29);ctx.fill();}
  }
  // деньги
  var tt=performance.now()/1000;
  for(var c3=0;c3<cash.length;c3++){var C2=cash[c3];
    if(C2.x<left-40||C2.x>left+vw+40||C2.y<top-40||C2.y>top+vh+40)continue;
    var bob=Math.sin(tt*3+C2.ph)*4,s=8+Math.sin(tt*3+C2.ph)*1.5;
    ctx.fillStyle='rgba(0,0,0,.25)';ctx.beginPath();ctx.arc(C2.x+2,C2.y+4,10,0,6.29);ctx.fill();
    ctx.save();ctx.translate(C2.x,C2.y+bob);ctx.rotate(Math.sin(tt*2+C2.ph)*0.3);
    ctx.fillStyle='#ffd23f';ctx.fillRect(-s,-s*0.7,s*2,s*1.4);
    ctx.fillStyle='#b8860b';ctx.font='700 11px system-ui';ctx.textAlign='center';ctx.fillText('$',0,4);ctx.restore();}
  // пешеходы
  for(var p3=0;p3<peds.length;p3++){var P2=peds[p3];
    if(P2.x<left||P2.x>left+vw||P2.y<top||P2.y>top+vh)continue;
    ctx.fillStyle='rgba(0,0,0,.25)';ctx.beginPath();ctx.arc(P2.x+2,P2.y+3,5,0,6.29);ctx.fill();
    ctx.fillStyle=P2.c;ctx.beginPath();ctx.arc(P2.x,P2.y,5,0,6.29);ctx.fill();}
  // трафик
  for(var t5=0;t5<traffic.length;t5++){var T3=traffic[t5];
    var tx=T3.h?T3.s:T3.k*PITCH+ROAD/2+T3.lane, ty=T3.h?T3.k*PITCH+ROAD/2+T3.lane:T3.s;
    if(tx<left-60||tx>left+vw+60||ty<top-60||ty>top+vh+60)continue;
    ctx.save();ctx.translate(tx,ty);ctx.rotate(T3.h?0:Math.PI/2);
    ctx.fillStyle='rgba(0,0,0,.3)';ctx.fillRect(-18,-9+3,36,18);
    ctx.fillStyle=T3.c;ctx.beginPath();ctx.roundRect(-18,-9,36,18,5);ctx.fill();
    ctx.fillStyle='rgba(20,30,50,.7)';ctx.fillRect(-8,-7,16,14);ctx.restore();}
  // припаркованные машины
  for(var q4=0;q4<parked.length;q4++){var PC=parked[q4];
    if(PC.x<left-60||PC.x>left+vw+60||PC.y<top-60||PC.y>top+vh+60)continue;
    ctx.save();ctx.translate(PC.x,PC.y);ctx.rotate(PC.a);
    ctx.fillStyle='rgba(0,0,0,.3)';ctx.beginPath();ctx.roundRect(-18,-9+3,36,18,5);ctx.fill();
    ctx.fillStyle=PC.c;ctx.beginPath();ctx.roundRect(-18,-9,36,18,5);ctx.fill();
    ctx.fillStyle='rgba(20,30,50,.7)';ctx.fillRect(-8,-7,16,14);ctx.restore();}
  // пеший игрок
  if(onFoot){
    ctx.fillStyle='rgba(0,0,0,.3)';ctx.beginPath();ctx.arc(foot.x+2,foot.y+3,8,0,6.29);ctx.fill();
    ctx.fillStyle='#2b2d42';ctx.beginPath();ctx.arc(foot.x,foot.y,8,0,6.29);ctx.fill();
    ctx.fillStyle='#f1c27d';ctx.beginPath();ctx.arc(foot.x,foot.y-6,4.4,0,6.29);ctx.fill();
  }
  // игрок
  ctx.save();ctx.translate(car.x,car.y);ctx.rotate(car.a);
  ctx.fillStyle='rgba(0,0,0,.3)';ctx.beginPath();ctx.roundRect(-20,-11+4,40,22,7);ctx.fill();
  ctx.fillStyle=car.c;ctx.beginPath();ctx.roundRect(-20,-11,40,22,7);ctx.fill();
  ctx.fillStyle='#b02430';ctx.beginPath();ctx.roundRect(-13,-12,17,24,4);ctx.fill();
  ctx.fillStyle='#14213d';ctx.fillRect(2,-9,9,18);ctx.fillRect(-11,-9,7,18);
  ctx.fillStyle='#ffd23f';ctx.beginPath();ctx.arc(19,-6,2.6,0,6.29);ctx.arc(19,6,2.6,0,6.29);ctx.fill();
  ctx.fillStyle='#222';ctx.fillRect(-14,-14,8,4);ctx.fillRect(6,-14,8,4);ctx.fillRect(-14,10,8,4);ctx.fillRect(6,10,8,4);
  ctx.restore();
  ctx.restore();
  // ======================= HUD =======================
  var spd=Math.round(Math.hypot(car.vx,car.vy)*0.36);
  ctx.fillStyle='rgba(0,0,0,.5)';ctx.beginPath();ctx.roundRect(14,14,210,86,12);ctx.fill();
  ctx.fillStyle='#ffd23f';ctx.font='800 26px system-ui';ctx.textAlign='left';ctx.fillText('$ '+money,28,48);
  ctx.fillStyle='#fff';ctx.font='700 16px system-ui';ctx.fillText(spd+' км/ч',28,76);
  ctx.fillStyle=(keys.Space?'#ffd23f':'#7d8597');ctx.font='600 12px system-ui';
  ctx.fillText(keys.Space?'РУЧНИК':'Пробел — ручник'+(onFoot?'':'   F — выйти'),28,94);
  ctx.fillStyle='#7d8597';ctx.fillText(onFoot?'WASD — идти   F — сесть/угнать':'',28,94);
  // подсказка у машины
  if(onFoot&&nearCar){ctx.fillStyle='rgba(0,0,0,.6)';ctx.beginPath();ctx.roundRect(W/2-150,H-70,300,38,10);ctx.fill();
    ctx.fillStyle='#ffd23f';ctx.font='700 15px system-ui';ctx.textAlign='center';
    ctx.fillText(nearCar.ti!==undefined?'Нажми F — угнать машину 🚗':'Нажми F — сесть в машину',W/2,H-45);ctx.textAlign='left';}
  // миникарта
  var mm=150,mx=W-mm-16,my=16,s2=mm/WORLD;
  ctx.fillStyle='rgba(0,0,0,.55)';ctx.beginPath();ctx.roundRect(mx-6,my-6,mm+12,mm+12,10);ctx.fill();
  ctx.fillStyle='#26342a';ctx.fillRect(mx,my,mm,mm);
  ctx.fillStyle='#4a5160';
  for(var k3=0;k3<=N;k3++){ctx.fillRect(mx+k3*PITCH*s2-1,my,2,mm);ctx.fillRect(mx,my+k3*PITCH*s2-1,mm,2);}
  ctx.fillStyle='#ffd23f';ctx.beginPath();var pt=onFoot?foot:car;ctx.arc(mx+pt.x*s2,my+pt.y*s2,3.4,0,6.29);ctx.fill();
  ctx.strokeStyle='#fff';ctx.lineWidth=1;ctx.strokeRect(mx+left*s2,my+top*s2,vw*s2,vh*s2);
}

// ======================= ЦИКЛ =======================
var last=performance.now();
function loop(now){var dt=Math.min(0.05,(now-last)/1000);last=now;
  if(started)step(dt); else {var tt=now/1000;car.a=-Math.PI/2+Math.sin(tt*0.5)*0.05;}
  draw();requestAnimationFrame(loop);}
requestAnimationFrame(loop);
</script>
